name: Beta IPA (devbeta)

# Builds an unsigned sideloadable IPA for every push to devbeta.
# No Apple Developer secrets required: the IPA is unsigned so you
# re-sign on install with AltStore / Sideloadly / TrollStore etc.
# For a signed TestFlight build, see the optional `signed` job below.
on:
  push:
    branches: [devbeta]
  pull_request:
    branches: [devbeta]
  workflow_dispatch:
    inputs:
      version_suffix:
        description: "Beta suffix (e.g. b1). Default: run number"
        required: false
        default: ""

env:
  PROJECT: EmGestie.xcodeproj
  SCHEME: EmGestie
  CONFIGURATION: Release
  BUNDLE_ID: dev.emgestie.app

jobs:
  beta-unsigned:
    name: Build unsigned beta IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode / SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks | head -n 20

      - name: Resolve beta version
        id: ver
        run: |
          SUFFIX="${{ inputs.version_suffix }}"
          if [ -z "$SUFFIX" ]; then SUFFIX="b${{ github.run_number }}"; fi
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "Beta suffix: $SUFFIX"

      # CURRENT_PROJECT_VERSION override stamps each beta with the run number
      # so sideloaders see it as an update.
      - name: Build .app (no code sign)
        run: |
          set -euo pipefail
          mkdir -p build/unsigned
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build/unsigned" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(ls -d build/unsigned/*.app | head -n 1)
          echo "App: $APP"
          rm -rf Payload EmGestie-beta-*.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          IPA="EmGestie-beta-${{ steps.ver.outputs.suffix }}.ipa"
          zip -qry "$IPA" Payload
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"
          unzip -l "$IPA" | head -n 20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmGestie-beta-${{ steps.ver.outputs.suffix }}
          path: EmGestie-beta-*.ipa
          retention-days: 30

  # Creates a versioned GitHub pre-release so betas are easy to find
  # and download on the iPhone. Only runs on pushes (not PRs).
  release:
    name: Publish beta pre-release
    needs: beta-unsigned
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          target_commitish: devbeta
          prerelease: true
          generate_release_notes: true
          name: Beta b${{ github.run_number }} (devbeta)
          files: dist/**/*.ipa

  # OPTIONAL: signed build for direct install / TestFlight.
